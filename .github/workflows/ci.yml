name: CI
# Roda em toda branch e em todo pull request: é a garantia de que schema, integridade,
# regras editoriais e testes passaram antes do merge (docs/processo/README.md, etapa 6).
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
