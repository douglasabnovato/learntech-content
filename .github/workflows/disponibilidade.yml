# Monitoramento de disponibilidade do ecossistema: a cada 6 horas confere se a API e os quatro sites respondem.
# Se algo cair, o job falha e o GitHub avisa o dono do repositório por e-mail (configuração padrão de notificações).
# Também pode ser disparado à mão na aba Actions (workflow_dispatch).
name: disponibilidade

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API e sites respondem 200
        run: |
          set -u
          falhas=0
          for url in \
            "https://learntech-content.douglasabnovato.workers.dev/v1/index.json" \
            "https://learntech-content.douglasabnovato.workers.dev/v1/learn-tech/programas.json" \
            "https://learn-tech-pied.vercel.app/" \
            "https://bootcamps-dun.vercel.app/" \
            "https://douglasabnovato.github.io/career/" \
            "https://douglasabnovato.github.io/tools/"; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo 000)
            echo "$codigo $url"
            [ "$codigo" = "200" ] || falhas=$((falhas+1))
          done
          echo "falhas: $falhas"
          [ "$falhas" -eq 0 ]
