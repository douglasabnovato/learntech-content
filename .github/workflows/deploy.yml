name: Deploy
# Publica a API na Cloudflare quando a main recebe um push.
# Só roda se os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID estiverem cadastrados em
# Settings → Secrets and variables → Actions. Sem eles, o deploy continua manual (npm run deploy).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-producao
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Segredos da Cloudflare ausentes: deploy manual (npm run deploy)."; fi
      - uses: actions/checkout@v4
        if: steps.segredos.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.segredos.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.segredos.outputs.ok == 'true'
        run: npm ci
      - if: steps.segredos.outputs.ok == 'true'
        run: npm run verificar
      - name: Migrações do D1
        if: steps.segredos.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply learntech-acessos --remote
      - name: Deploy
        if: steps.segredos.outputs.ok == 'true'
        run: npx wrangler deploy
