name: Deploy
# Publica a API na Cloudflare depois que a CI (job "verificar": typecheck, lint, testes e build) passa
# num push na main. Nunca publica commit que não passou na CI.
#   - Automático: workflow_run da CI, só quando a CI terminou com sucesso, em push (não em pull request) na main.
#     O checkout usa exatamente o commit que a CI verificou (head_sha).
#   - Manual: workflow_dispatch na main; roda typecheck, lint, testes e build antes de publicar.
# Segredos obrigatórios em Settings → Secrets and variables → Actions: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# O automático só roda com a variável de repositório DEPLOY_AUTOMATICO = sim (Settings → Secrets and variables →
# Actions → Variables), ligada depois de cadastrar os segredos. Sem ela, o job aparece como pulado, e não vermelho.
# No disparo manual, sem os segredos o job FALHA, para não parecer publicado quando não foi. Deploy local: npm run deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: deploy-producao
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.DEPLOY_AUTOMATICO == 'sim' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID ausentes: nada foi publicado. Cadastre-os ou publique à mão (npm run deploy)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          # Em workflow_run, publica o commit que a CI verificou, e não o que estiver na ponta da main agora.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint (só no disparo manual; no automático a CI já rodou)
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint
      - run: npm run verificar
      - name: Migrações do D1
        run: npx wrangler d1 migrations apply learntech-acessos --remote
      - name: Deploy
        run: npx wrangler deploy
